<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <title>{% block title %}ИАС{% endblock %}</title>
  <style>
    :root {
      --bg: #F7F6F2;
      --surface: #FBFBF9;
      --border: #D4D1CA;
      --text: #28251D;
      --muted: #7A7974;
      --primary: #01696F;
      --primary-hover: #0C4E54;
      --error: #A12C7B;
      --success: #437A22;
      --warn: #964219;
    }
    * { box-sizing: border-box; }
    html, body { margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
      background: var(--bg);
      color: var(--text);
      font-size: 15px;
      line-height: 1.55;
    }
    header {
      background: var(--surface);
      border-bottom: 1px solid var(--border);
      padding: 14px 32px;
      display: flex;
      gap: 24px;
      align-items: center;
    }
    header .brand {
      font-weight: 700;
      font-size: 17px;
      color: var(--primary);
    }
    header nav a {
      color: var(--text);
      text-decoration: none;
      margin-right: 18px;
      font-size: 14px;
    }
    header nav a:hover { color: var(--primary); }
    main { max-width: 1100px; margin: 28px auto; padding: 0 24px; }
    h1 { font-size: 24px; margin: 0 0 18px 0; }
    h2 { font-size: 18px; margin: 28px 0 10px 0; }
    .card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 18px 20px;
      margin-bottom: 18px;
    }
    table { width: 100%; border-collapse: collapse; }
    th, td {
      padding: 8px 10px;
      text-align: left;
      border-bottom: 1px solid var(--border);
      font-size: 14px;
    }
    th { background: #F0EFEB; font-weight: 600; color: var(--muted); text-transform: uppercase; font-size: 12px; letter-spacing: 0.04em; }
    tr:last-child td { border-bottom: none; }
    a { color: var(--primary); }
    a:hover { color: var(--primary-hover); }
    .btn {
      display: inline-block;
      background: var(--primary);
      color: white;
      border: none;
      padding: 9px 18px;
      border-radius: 6px;
      cursor: pointer;
      text-decoration: none;
      font-size: 14px;
      font-weight: 500;
    }
    .btn:hover { background: var(--primary-hover); color: white; }
    .btn-secondary {
      background: transparent;
      color: var(--primary);
      border: 1px solid var(--primary);
    }
    .btn-secondary:hover { background: var(--primary); color: white; }
    label { display: block; margin: 12px 0 4px 0; font-size: 13px; color: var(--muted); }
    input[type=text], input[type=number], input[type=datetime-local], select, textarea {
      width: 100%;
      padding: 8px 10px;
      border: 1px solid var(--border);
      border-radius: 6px;
      font-size: 14px;
      background: white;
      font-family: inherit;
    }
    input:focus, select:focus, textarea:focus {
      outline: none; border-color: var(--primary);
    }
    .grid-2 { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; }
    .kpi { display: flex; gap: 24px; flex-wrap: wrap; }
    .kpi .item {
      flex: 1; min-width: 160px;
      background: var(--surface); border: 1px solid var(--border);
      border-radius: 8px; padding: 14px 18px;
    }
    .kpi .item .v { font-size: 28px; font-weight: 700; color: var(--primary); }
    .kpi .item .l { font-size: 12px; color: var(--muted); text-transform: uppercase; letter-spacing: 0.05em; }
    .badge {
      display: inline-block; padding: 2px 8px; border-radius: 10px;
      font-size: 12px; font-weight: 600;
    }
    .badge-new { background: #E5F2F3; color: var(--primary); }
    .badge-prod { background: #FFEDD9; color: var(--warn); }
    .badge-done { background: #E2F2D8; color: var(--success); }
    .flash {
      padding: 10px 14px; border-radius: 6px; margin-bottom: 14px;
      font-size: 14px;
    }
    .flash-success { background: #E2F2D8; color: var(--success); }
    .flash-error { background: #FBE2EE; color: var(--error); }
    .muted { color: var(--muted); font-size: 13px; }
    .form-inline { display: flex; gap: 8px; align-items: end; flex-wrap: wrap; }
    .form-inline > * { flex: 1; min-width: 120px; }
  </style>
</head>
<body>
  <header>
    <div class="brand">ИАС</div>
    <nav>
      <a href="{{ url_for('dashboard') }}">Главная</a>
      <a href="{{ url_for('orders_list') }}">Заказы</a>
      <a href="{{ url_for('order_new') }}">Новый заказ</a>
      <a href="{{ url_for('report') }}">Отчёт</a>
    </nav>
  </header>
  <main>
    {% with messages = get_flashed_messages(with_categories=true) %}
      {% for cat, msg in messages %}
        <div class="flash flash-{{ cat }}">{{ msg }}</div>
      {% endfor %}
    {% endwith %}
    {% block content %}{% endblock %}
  </main>
</body>
</html>
